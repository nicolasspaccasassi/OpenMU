services:
  nginx-80:
    image: nginx:alpine
    container_name: nginx-80
    ports:
      - "80:80"
    volumes:
      - ./nginx/nginx.dev.conf:/etc/nginx/nginx.conf:ro
    depends_on:
      - openmu-startup

  openmu-startup:
    image: munique/openmu
    container_name: openmu-startup
    ports:
      - "127.0.0.1::8080"
      - "45901:45901"
      - "45902:45902"
      - "45903:45903"
      - "45904:45904"
      - "45905:45905"
      - "45906:45906"
      - "44405:44405"
      - "44406:44406"
      - "45980:45980"
    environment:
      DB_HOST: ${DB_HOST:-database}
      DB_ADMIN_USER: ${DB_ADMIN_USER:-}
      DB_ADMIN_PW: ${DB_ADMIN_PW:-}
      ASPNETCORE_URLS: http://+:8080
      # Tells connecting clients which IP to use for the game/connect servers. Without this,
      # the container defaults to "public" (asks an external service for our public IP), which
      # is unreachable from the same machine the server runs on (NAT hairpinning) - exactly the
      # setup for Fase 2 (client + server on the same PC). Loopback resolves to 127.127.127.127;
      # the whole 127.0.0.0/8 block routes to localhost on Windows, so clients connecting from
      # this same machine reach the server fine without any extra client-side configuration.
      # Revisit this once the server moves to its own VPS (Fase 5).
      RESOLVE_IP: loopback
      # Optional bootstrap admin panel user. Without it, the admin panel is reachable
      # without a login until the first user has been created within the panel itself.
      OPENMU_ADMIN_USER: ${OPENMU_ADMIN_USER:-}
      OPENMU_ADMIN_PASSWORD: ${OPENMU_ADMIN_PASSWORD:-}
      # Optional base32 TOTP secret, if the bootstrap user should require a second factor.
      OPENMU_ADMIN_TOTP_SECRET: ${OPENMU_ADMIN_TOTP_SECRET:-}
      # website authenticates itself at the public API under /api.
    volumes:
      - adminpanel-keys:/app/data-protection-keys
    working_dir: /app/
    depends_on:
      - database

  database:
    image: postgres
    container_name: database
    environment:
      POSTGRES_PASSWORD: ${DB_ADMIN_PW:-admin}
      POSTGRES_DB: ${DB_NAME:-openmu}
      POSTGRES_USER: ${DB_ADMIN_USER:-postgres}
    ports:
      - "5432"
    volumes:
      - dbdata:/var/lib/postgresql #store data on volume

volumes:
  adminpanel-keys:
  dbdata: